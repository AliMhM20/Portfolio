<html lang="fa" dir="rtl" class="dark">

    <meta charset="UTF-8" />

    <title>علی محمدی | Ali Mohamadi — مهندس کامپیوتر</title>
    
    <!-- Instant Zero-Flash Theme Initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio_design1_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Sahel Font (Persian) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css">
